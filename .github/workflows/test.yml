name: HiveMind CI

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      # Keep reporting every matrix leg even if one fails: a single
      # leg failure must not hide the state of the others.
      fail-fast: false
      matrix:
        # Python 3.8 dropped together with the torch>=2.6.0 floor:
        # torch 2.6.0 provides no 3.8 wheels.
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Install HiveMind package (editable)
      run: |
        # Make `import hivemind` resolvable in CI regardless of how
        # pytest computes its import basedir (see tests/__init__.py).
        pip install -e . --no-deps
    
    - name: Generate protobuf files
      run: |
        python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short -m "not slow"
    
    - name: Upload coverage report
      # Coverage upload is advisory: it must never block CI.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  guard:
    name: Serialization Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Blocking: unsafe deserialization must never come back. This
    # guard is also the documented answer to the PYSEC-2026-2286
    # pip-audit finding: the vulnerable surface is structurally
    # absent from the codebase and this job keeps it that way.
    # The guard scans source text: it stops accidents, not
    # sabotage - documented limits in CONTRIBUTING.md.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Compile-check benchmark script
      run: |
        python -m py_compile benchmark.py
    
    - name: Block unsafe deserialization; validate exception markers
      run: |
        python - <<'EOF'
        import datetime
        import json
        import os
        import pathlib
        import re
        import sys
        import urllib.request

        REPO = "LeaderX404/HiveMind"
        TOKEN = os.environ.get("GITHUB_TOKEN", "")
        PATTERNS = [
            (r"torch\.load\s*\(", "torch.load"),
            (r"pickle\.load\s*\(", "pickle.load"),
            (r"pickle\.loads\s*\(", "pickle.loads"),
            (r"pickle\.Unpickler", "pickle.Unpickler"),
            (r"yaml\.load\s*\(", "yaml.load (use yaml.safe_load)"),
        ]
        MARKER = re.compile(
            r"serialization-guard: allowed\s*#issue-(\d+)\s+expires=(\d{4}-\d{2}-\d{2})"
        )
        MARKER_HINT = (
            "exception marker must be the full form: "
            "serialization-guard: allowed #issue-NNN expires=YYYY-MM-DD"
        )
        MAX_TTL_DAYS = 90

        errors = []
        exceptions = []

        roots = [pathlib.Path("hivemind"), pathlib.Path("tests")]
        bench = pathlib.Path("benchmark.py")
        files = []
        for root in roots:
            files.extend(root.rglob("*.py"))
        if bench.exists():
            files.append(bench)

        for path in files:
            for lineno, line in enumerate(
                path.read_text(encoding="utf-8").splitlines(), 1
            ):
                stripped = line.strip()
                if stripped.startswith("#"):
                    continue
                for pattern, label in PATTERNS:
                    if not re.search(pattern, line):
                    continue
                    m = MARKER.search(line)
                    if not m:
                        errors.append(
                            f"{path}:{lineno}: {label}: {stripped}"
                        )
                        errors.append(f"  -> {MARKER_HINT}")
                    else:
                        exceptions.append(
                            (str(path), lineno, int(m.group(1)), m.group(2))
                        )

        # Layer 1 (issue binding): open, labeled security-exception,
        # assigned. API failures fail closed.
        today = datetime.date.today()
        for path, lineno, issue, expires in exceptions:
            req = urllib.request.Request(
                f"https://api.github.com/repos/{REPO}/issues/{issue}",
                headers={
                    "Authorization": f"token {TOKEN}",
                    "Accept": "application/vnd.github+json",
                },
            )
            try:
                with urllib.request.urlopen(req) as resp:
                    data = json.load(resp)
            except Exception as exc:
                errors.append(
                    f"{path}:{lineno}: cannot verify issue #{issue} (fail closed): {exc}"
                )
                continue
            labels = [lab.get("name") for lab in data.get("labels", [])]
            if data.get("state") != "open":
                errors.append(f"{path}:{lineno}: issue #{issue} is not open")
            if "security-exception" not in labels:
                errors.append(
                    f"{path}:{lineno}: issue #{issue} lacks the security-exception label"
                )
            if not data.get("assignee"):
                errors.append(f"{path}:{lineno}: issue #{issue} has no assignee")

        # Layer 2 (TTL): expiry must be in the future, at most 90 days out
        for path, lineno, issue, expires in exceptions:
            exp = datetime.date.fromisoformat(expires)
            if exp <= today:
                errors.append(
                    f"{path}:{lineno}: exception expired on {expires} - remove it or renew the issue"
                )
            elif (exp - today).days > MAX_TTL_DAYS:
                errors.append(
                    f"{path}:{lineno}: exception TTL exceeds {MAX_TTL_DAYS} days"
                )

        # Layer 3 (ratchet): marker count may never exceed the baseline
        baseline = int(
            pathlib.Path("serialization_exceptions.baseline")
            .read_text()
            .strip()
        )
        if len(exceptions) > baseline:
            errors.append(
                f"exception count {len(exceptions)} exceeds baseline {baseline} "
                "(net-zero rule: retire one before adding another)"
            )

        if errors:
            print("\n".join(errors))
            sys.exit(1)
        print(
            f"Serialization Guard: clean. {len(exceptions)} documented "
            f"exception(s), baseline {baseline}."
        )
        EOF

  lint:
    name: Lint Code (advisory)
    runs-on: ubuntu-latest
    # The codebase still carries pre-existing black/isort style debt.
    # Lint runs on every push as an advisory signal until the reformat
    # lands, so it reports issues without blocking merges.
    # Tracked in issue #3; make this job blocking again once the
    # reformat lands.
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Run flake8
      run: |
        flake8 hivemind/ --max-line-length=100 --ignore=E203,E501,W503
    
    - name: Run black (check)
      run: |
        black --check hivemind/ tests/ --line-length=100
    
    - name: Run isort (check)
      run: |
        isort --check-only hivemind/ tests/ --profile black --line-length=100
    
    - name: Run mypy
      run: |
        mypy hivemind/ --ignore-missing-imports --python-version 3.9

  security:
    name: Security Audit (advisory)
    runs-on: ubuntu-latest
    # Known-vulnerable dependencies must be visible, not invisible:
    # the job reports findings without blocking merges. Fix findings
    # by raising version floors in requirements.txt. The torch floor
    # is >=2.6.0 (CVE-2025-32434 fixed upstream in 2.6.0), which also
    # means Python 3.8 is no longer supported. PYSEC-2026-2286
    # (torch <2.10) is documented as structurally mitigated: the
    # unsafe surface is absent from the codebase and the blocking
    # Serialization Guard job keeps it that way.
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install pip-audit
      run: |
        pip install pip-audit
    
    - name: Audit dependencies for known vulnerabilities
      run: |
        pip-audit -r requirements.txt

  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install build dependencies
      run: |
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-package
        path: dist/*

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install docs dependencies
      run: |
        pip install mkdocs mkdocs-material mkdocs-with-pdf
    
    - name: Build documentation
      run: |
        mkdocs build --strict
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-docs
        path: site/*

  release:
    name: Release Package
    needs: [test, guard, lint, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: hivemind-package
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages_dir: dist/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
