name: HiveMind CI

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      # Temporary: allows the diagnostics step below to open an issue with test logs
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Install HiveMind package (editable)
      run: |
        # Make `import hivemind` resolvable in CI regardless of how
        # pytest computes its import basedir (see tests/__init__.py).
        pip install -e . --no-deps
    
    - name: Generate protobuf files
      run: |
        python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=long 2>&1 | tee unit_tests_output.txt
        exit ${PIPESTATUS[0]}
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=long -m "not slow" 2>&1 | tee integration_tests_output.txt
        exit ${PIPESTATUS[0]}
    
    - name: Report test failure (temporary CI diagnostics)
      if: failure()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYVER: ${{ matrix.python-version }}
      run: |
        python - <<'EOF'
        import json, os, urllib.request

        def post_issue(title, body):
            data = json.dumps({"title": title, "body": body}).encode()
            req = urllib.request.Request(
                "https://api.github.com/repos/LeaderX404/HiveMind/issues",
                data=data,
                method="POST",
                headers={
                    "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json",
                    "User-Agent": "ci-diagnostics",
                },
            )
            try:
                with urllib.request.urlopen(req) as resp:
                    print("issue created:", resp.status)
            except Exception as e:
                print("issue creation failed:", e)

        parts = []
        for name in ("unit_tests_output.txt", "integration_tests_output.txt"):
            try:
                with open(name, "r", errors="replace") as f:
                    parts.append("## " + name + "\n\n```\n" + f.read()[-25000:] + "\n```")
            except FileNotFoundError:
                pass
        post_issue(
            "[CI diagnostics] test failure on Python " + os.environ.get("PYVER", "?"),
            "\n\n".join(parts) or "no logs captured",
        )
        EOF

    - name: Upload coverage report
      # Coverage upload is advisory: it must never block CI.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint Code (advisory)
    runs-on: ubuntu-latest
    # The codebase still carries pre-existing black/isort style debt.
    # Lint runs on every push as an advisory signal until the reformat
    # lands, so it reports issues without blocking merges.
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Run flake8
      run: |
        flake8 hivemind/ --max-line-length=100 --ignore=E203,E501,W503
    
    - name: Run black (check)
      run: |
        black --check hivemind/ tests/ --line-length=100
    
    - name: Run isort (check)
      run: |
        isort --check-only hivemind/ tests/ --profile black --line-length=100
    
    - name: Run mypy
      run: |
        mypy hivemind/ --ignore-missing-imports --python-version 3.8

  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install build dependencies
      run: |
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-package
        path: dist/*

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install docs dependencies
      run: |
        pip install mkdocs mkdocs-material mkdocs-with-pdf
    
    - name: Build documentation
      run: |
        mkdocs build --strict
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-docs
        path: site/*

  release:
    name: Release Package
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: hivemind-package
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages_dir: dist/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
