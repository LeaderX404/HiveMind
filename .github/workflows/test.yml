name: HiveMind CI

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      # Keep reporting every matrix leg even if one fails: a single
      # leg failure must not hide the state of the others.
      fail-fast: false
      matrix:
        # Python 3.8 dropped together with the torch>=2.6.0 floor:
        # torch 2.6.0 provides no 3.8 wheels.
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Install HiveMind package (editable)
      run: |
        # Make `import hivemind` resolvable in CI regardless of how
        # pytest computes its import basedir (see tests/__init__.py).
        pip install -e . --no-deps
    
    - name: Generate protobuf files
      run: |
        python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short -m "not slow"
    
    - name: Upload coverage report
      # Coverage upload is advisory: it must never block CI.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint Code (advisory)
    runs-on: ubuntu-latest
    # The codebase still carries pre-existing black/isort style debt.
    # Lint runs on every push as an advisory signal until the reformat
    # lands, so it reports issues without blocking merges.
    # Tracked in issue #3; make this job blocking again once the
    # reformat lands.
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Run flake8
      run: |
        flake8 hivemind/ --max-line-length=100 --ignore=E203,E501,W503
    
    - name: Run black (check)
      run: |
        black --check hivemind/ tests/ --line-length=100
    
    - name: Run isort (check)
      run: |
        isort --check-only hivemind/ tests/ --profile black --line-length=100
    
    - name: Run mypy
      run: |
        mypy hivemind/ --ignore-missing-imports --python-version 3.9

  security:
    name: Security Audit (advisory)
    runs-on: ubuntu-latest
    # Known-vulnerable dependencies must be visible, not invisible:
    # the job reports findings without blocking merges. Fix findings
    # by raising version floors in requirements.txt. The torch floor
    # is >=2.6.0 (CVE-2025-32434 fixed upstream in 2.6.0), which also
    # means Python 3.8 is no longer supported.
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install pip-audit
      run: |
        pip install pip-audit
    
    - name: Audit dependencies for known vulnerabilities
      run: |
        pip-audit -r requirements.txt

  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install build dependencies
      run: |
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-package
        path: dist/*

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install docs dependencies
      run: |
        pip install mkdocs mkdocs-material mkdocs-with-pdf
    
    - name: Build documentation
      run: |
        mkdocs build --strict
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: hivemind-docs
        path: site/*

  release:
    name: Release Package
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: hivemind-package
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages_dir: dist/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
