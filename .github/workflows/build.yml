name: Build HiveMind.exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build standalone Windows executable
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.6.0,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install streamlit pyinstaller pystray Pillow

      - name: Generate protobuf files
        run: |
          python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto

      - name: Build HiveMind.exe
        run: pyinstaller build.spec --noconfirm

      - name: Read the release version
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path RELEASE.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $v = $raw.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build HiveMind-Setup.exe
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\hivemind.iss'

      - name: Upload HiveMind.exe
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-windows-x64
          path: dist/HiveMind.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload HiveMind-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-Setup-windows-x64
          path: installer/Output/HiveMind-Setup.exe
          retention-days: 30
          if-no-files-found: error

      # Debug build (issue #44): artifact only - the black
      # window prints the traceback that kills the windowed exe.
      - name: Upload HiveMind-Debug.exe
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-Debug-windows-x64
          path: dist/HiveMind-Debug.exe
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish the public release
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download HiveMind.exe
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-windows-x64
          path: dist/

      - name: Download HiveMind-Setup.exe
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-Setup-windows-x64
          path: installer/Output/

      - name: Publish (immutable releases only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_version=$(grep '^version:' RELEASE.md | head -1 | sed 's/^version:[[:space:]]*//')
          old_version=$(git show "${{ github.event.before }}:RELEASE.md" 2>/dev/null | grep '^version:' | head -1 | sed 's/^version:[[:space:]]*//' || echo "")
          echo "new=$new_version old=$old_version"
          if [ -z "$new_version" ]; then
            echo "RELEASE.md has no version - nothing to publish"
            exit 1
          fi
          if [ "$new_version" = "$old_version" ]; then
            echo "version line unchanged - publishing nothing"
            exit 0
          fi
          if gh release view "$new_version"; then
            echo "release $new_version already exists - refusing to overwrite it (immutable releases)"
            exit 1
          fi
          echo "publishing $new_version"
          gh release create "$new_version" --title "HiveMind $new_version" --notes "Standalone Windows build. Download HiveMind.exe or HiveMind-Setup.exe - nothing else to install."
          gh release upload "$new_version" dist/HiveMind.exe installer/Output/HiveMind-Setup.exe

  release-windows:
    name: Attach HiveMind.exe to the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download HiveMind.exe
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-windows-x64
          path: dist/

      - name: Download HiveMind-Setup.exe
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-Setup-windows-x64
          path: installer/Output/

      - name: Attach to the release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/HiveMind.exe
            installer/Output/HiveMind-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
