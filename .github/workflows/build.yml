name: Build HiveMind.exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build the onedir app and the core bundle
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.6.0,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install streamlit pyinstaller pystray Pillow

      - name: Generate protobuf files
        run: |
          python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto

      - name: Build the onedir app
        run: pyinstaller build.spec --noconfirm

      - name: Bundle the app directory
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("dist/HiveMind-UI", "HiveMind-UI-windows-x64.zip")

      - name: Build the core bundle (heavy libraries, downloaded once per machine)
        shell: pwsh
        run: |
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*torch' -and $_ -notmatch '^\s*accelerate' -and $_ -notmatch '^\s*bitsandbytes' } | Set-Content core-reqs.txt
          pip install --target core -r core-reqs.txt
          pip install --target core --no-deps "accelerate>=0.20.0" "bitsandbytes>=0.39.0"
          pip install --target core "torch>=2.6.0,<3.0" --index-url https://download.pytorch.org/whl/cpu
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("core", "HiveMind-Core-windows-x64.zip")

      - name: Read the release version
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path RELEASE.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $v = $raw.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Hash the core bundle
        id: corehash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Path "HiveMind-Core-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Fetch the previous UI bundle (for the patch diff)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Best-effort by definition: a missing previous bundle
          # only means the patch will be full. Every failure is
          # absorbed; the build must never die here.
          echo "gh path: $(command -v gh || echo missing)"
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no previous release - the patch will be full"
            exit 0
          fi
          gh release download "$tag" --pattern "HiveMind-UI-*.zip" --dir prev --clobber > /dev/null 2>&1 || true
          first_zip=$(ls prev/*.zip 2>/dev/null | head -1)
          if [ -n "$first_zip" ]; then
            mv "$first_zip" prev/prev-ui.zip
            echo "previous UI bundle: prev/prev-ui.zip"
          else
            echo "no previous UI bundle - the patch will be full"
          fi

      - name: Generate the update manifest and the UI patch
        run: python installer/make_manifest.py --ui-dir dist/HiveMind-UI --core-zip HiveMind-Core-windows-x64.zip --version ${{ steps.version.outputs.version }} --prev-ui-zip prev/prev-ui.zip --out-dir .

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build HiveMind-Setup.exe
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} /DCoreUrl=https://github.com/LeaderX404/HiveMind/releases/download/v${{ steps.version.outputs.version }}/HiveMind-Core-windows-x64.zip /DCoreSha256=${{ steps.corehash.outputs.sha256 }} installer\hivemind.iss'

      - name: Upload the app bundle (includes HiveMind-Debug.exe)
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-UI-windows-x64
          path: HiveMind-UI-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload HiveMind-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-Setup-windows-x64
          path: installer/Output/HiveMind-Setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload the core bundle
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-Core-windows-x64
          path: HiveMind-Core-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload the update manifest and patch
        uses: actions/upload-artifact@v4
        with:
          name: HiveMind-Update-windows-x64
          path: |
            update_manifest.json
            HiveMind-UI-patch.zip
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish the public release
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download HiveMind-Setup.exe
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-Setup-windows-x64
          path: publish/

      - name: Download the app bundle
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-UI-windows-x64
          path: publish/

      - name: Download the core bundle
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-Core-windows-x64
          path: publish/

      - name: Download the manifest and patch
        uses: actions/download-artifact@v4
        with:
          name: HiveMind-Update-windows-x64
          path: publish/

      - name: Publish (immutable releases only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_version=$(grep '^version:' RELEASE.md | head -1 | sed 's/^version:[[:space:]]*//')
          old_version=$(git show "${{ github.event.before }}:RELEASE.md" 2>/dev/null | grep '^version:' | head -1 | sed 's/^version:[[:space:]]*//' || echo "")
          echo "new=$new_version old=$old_version"
          if [ -z "$new_version" ]; then
            echo "RELEASE.md has no version line - refusing to publish"
            exit 1
          fi
          if [ "$new_version" = "$old_version" ]; then
            echo "version line unchanged - publishing nothing"
            exit 0
          fi
          if gh release view "$new_version" > /dev/null 2>&1; then
            echo "release $new_version already exists - refusing to overwrite it (immutable releases)"
            exit 1
          fi
          echo "publishing $new_version"
          gh release create "$new_version" --target ${{ github.sha }} --title "HiveMind $new_version" --notes "Onedir architecture (wave #47): run HiveMind-Setup.exe - the heavy core (torch, transformers) downloads once on first run. Existing installs update via SHA-256-verified delta patches."
          gh release upload "$new_version" publish/HiveMind-Setup.exe publish/HiveMind-UI-windows-x64.zip publish/HiveMind-Core-windows-x64.zip publish/HiveMind-UI-patch.zip publish/update_manifest.json

  release-windows:
    name: Attach Windows builds to the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.6.0,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install streamlit pyinstaller pystray Pillow

      - name: Generate protobuf files
        run: |
          python -m grpc_tools.protoc -I hivemind/net/proto --python_out=hivemind/net/proto --grpc_python_out=hivemind/net/proto hivemind/net/proto/inference.proto

      - name: Build the onedir app
        run: pyinstaller build.spec --noconfirm

      - name: Bundle the app directory
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("dist/HiveMind-UI", "HiveMind-UI-windows-x64.zip")

      - name: Build the core bundle
        shell: pwsh
        run: |
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*torch' -and $_ -notmatch '^\s*accelerate' -and $_ -notmatch '^\s*bitsandbytes' } | Set-Content core-reqs.txt
          pip install --target core -r core-reqs.txt
          pip install --target core --no-deps "accelerate>=0.20.0" "bitsandbytes>=0.39.0"
          pip install --target core "torch>=2.6.0,<3.0" --index-url https://download.pytorch.org/whl/cpu
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("core", "HiveMind-Core-windows-x64.zip")

      - name: Read the release version
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path RELEASE.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $v = $raw.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Hash the core bundle
        id: corehash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Path "HiveMind-Core-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Generate the update manifest and the UI patch
        run: python installer/make_manifest.py --ui-dir dist/HiveMind-UI --core-zip HiveMind-Core-windows-x64.zip --version ${{ steps.version.outputs.version }} --prev-ui-zip prev/prev-ui.zip --out-dir .

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build HiveMind-Setup.exe
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} /DCoreUrl=https://github.com/LeaderX404/HiveMind/releases/download/v${{ steps.version.outputs.version }}/HiveMind-Core-windows-x64.zip /DCoreSha256=${{ steps.corehash.outputs.sha256 }} installer\hivemind.iss'

      - name: Attach the release files to the tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/HiveMind-Setup.exe
            HiveMind-UI-windows-x64.zip
            HiveMind-Core-windows-x64.zip
            HiveMind-UI-patch.zip
            update_manifest.json
