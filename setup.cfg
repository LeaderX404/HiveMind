# Tool configuration for HiveMind.
#
# NOTE: All package metadata lives in setup.py. The previous [metadata] and
# [options] sections here contradicted setup.py and broke packaging:
# `package_dir = = hivemind` made setuptools look for a nonexistent
# hivemind/hivemind directory, so sdist/wheel builds failed instantly.
# They were removed during Phase 4 (CI stabilization); only tool
# configuration sections remain.

[flake8]
max-line-length = 100
ignore = E203, E501, W503

[black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
