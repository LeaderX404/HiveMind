[metadata]
name = hivemind
version = 0.2.0
author = LeaderX404
author_email = 
description = Run 7B+ LLMs on low-end devices via Neural Swarm Inference (2-bit quantization + distributed computing)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/LeaderX404/HiveMind
project_urls =
    Bug Tracker = https://github.com/LeaderX404/HiveMind/issues
    Documentation = https://github.com/LeaderX404/HiveMind#readme
    Source Code = https://github.com/LeaderX404/HiveMind

[options]
package_dir =
    = hivemind
packages = find:
install_requires =
    torch>=2.0.0
    transformers>=4.30.0
    sentencepiece
    accelerate
    bitsandbytes
    grpcio
    grpcio-tools
    protobuf
    ray[default]
    flask
    pyyaml
    tensorflow
    tflite-runtime

python_requires = >=3.8

[options.packages.find]
exclude =
    tests*
    examples*
    config*
    scripts*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    mypy>=1.0.0

[tool:pytest]
pytest.ini_options = pytest.ini

[flake8]
max-line-length = 100
ignore = E203, E501, W503

[black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
