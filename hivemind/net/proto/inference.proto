syntax = "proto3";

service InferenceService {
  rpc ProcessShard (InferenceRequest) returns (InferenceResponse);
  rpc GetStats (StatsRequest) returns (ServerStats);
}

message InferenceRequest {
  bytes input_data = 1;
  string model_id = 2;
  int32 shard_index = 3;
}

message InferenceResponse {
  bytes output_data = 1;
  string error = 2;
  int32 shard_index = 3;
}

message StatsRequest {
  // Empty request for stats
}

message ServerStats {
  int64 request_count = 1;
  int64 error_count = 2;
  int32 shard_index = 3;
}
